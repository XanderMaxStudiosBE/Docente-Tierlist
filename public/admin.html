<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin · Docente Ranking</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">Docente<span class="brand-light">Ranking</span></a><span class="header-note">Admin</span></header><main class="admin-main"><div class="eyebrow">BEHEER</div><h1>Adminpaneel</h1><p id="admin-status" role="status">Adminpaneel laden…</p><section id="admin-auth" class="admin-card" hidden><h2 id="auth-heading">Inloggen</h2><p id="auth-description">Log in met je adminaccount.</p><form id="admin-form"><label for="admin-email">E-mail</label><input id="admin-email" type="email" autocomplete="username" maxlength="254" required><label for="admin-password">Wachtwoord</label><input id="admin-password" type="password" autocomplete="current-password" maxlength="256" required><p id="auth-error" role="alert"></p><button id="login-admin" class="primary-button" type="submit">Inloggen</button></form></section><section id="admin-dashboard" hidden><div class="admin-heading"><h2>Klassen beheren</h2><button id="logout-admin" class="secondary-button">Uitloggen</button></div><p id="admin-email-display"></p><div id="admin-classes" class="admin-class-grid"></div><section class="admin-card"><h2>Rankings resetten</h2><p>Start een nieuwe stemronde. Rankings, duels en weekresultaten van de gekozen klas beginnen op nul. Docentnamen en foto’s blijven staan.</p><form id="reset-form"><label for="reset-class">Welke klas?</label><select id="reset-class"></select><label class="reset-confirm"><input id="confirm-reset" type="checkbox" required><span>Ik wil voor deze keuze een nieuwe stemronde starten.</span></label><button id="reset-rankings" class="danger-button" disabled>Rankings resetten</button></form></section></section><p><a href="/" class="admin-back">Terug naar de ranking</a></p></main><script type="module" src="/admin.js"></script></body></html>
